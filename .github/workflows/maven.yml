name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Grant execute permission to mvnw
      run: chmod +x ./Audio-Transcriber/mvnw ./audio-transcribe/mvnw
    - name: Build Audio-Transcriber
      working-directory: ./Audio-Transcriber
      run: ./mvnw clean compile
    - name: Build audio-transcribe
      working-directory: ./audio-transcribe
      run: ./mvnw clean compile
